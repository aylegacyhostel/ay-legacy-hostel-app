{% extends 'base.html' %}{% block content %}<h1>{% if student %}Edit Student{% else %}Add Student{% endif %}</h1><form class="form-card" method="post" enctype="multipart/form-data"><h2>Student Information</h2><div class="form-grid"><label>Student ID<input name="student_id" value="{{student.student_id if student else ''}}"></label><label>First Name<input name="first_name" required value="{{student.first_name if student else ''}}"></label><label>Last Name<input name="last_name" required value="{{student.last_name if student else ''}}"></label><label>Gender<select name="gender"><option></option>{% for x in ['Male','Female','Other'] %}<option {% if student and student.gender==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Phone<input name="phone" value="{{student.phone if student else ''}}"></label><label>Email<input type="email" name="email" value="{{student.email if student else ''}}"></label><label>School/University<input name="school" value="{{student.school if student else ''}}"></label><label>Program<input name="program" value="{{student.program if student else ''}}"></label><label>Year Level<input name="year_level" value="{{student.year_level if student else ''}}"></label><label>Date of Birth<input type="date" name="date_of_birth" value="{{student.date_of_birth if student else ''}}"></label><label>Hometown<input name="hometown" value="{{student.hometown if student else ''}}"></label><label>Photo<input type="file" name="photo" accept="image/*"></label></div><h2>Room</h2><div class="form-grid"><label>Room Number<select name="room_number"><option value="">Not assigned</option>{% for r in rooms %}<option value="{{r.room_number}}" {% if student and student.room_number==r.room_number %}selected{% endif %}>{{r.room_number}}</option>{% endfor %}</select></label><label>Bed Space<input name="bed_space" value="{{student.bed_space if student else ''}}"></label><label>Check-in<input type="date" name="check_in_date" value="{{student.check_in_date if student else ''}}"></label><label>Expected Check-out<input type="date" name="expected_check_out" value="{{student.expected_check_out if student else ''}}"></label><label>Status<select name="status">{% for x in ['Active','Checked Out','Reserved','Suspended'] %}<option {% if student and student.status==x %}selected{% elif not student and x=='Active' %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label></div><h2>Parent / Guardian</h2><div class="form-grid"><label>Name<input name="parent_name" value="{{student.parent_name if student else ''}}"></label><label>Phone<input name="parent_phone" value="{{student.parent_phone if student else ''}}"></label><label>Email<input name="parent_email" value="{{student.parent_email if student else ''}}"></label><label>Relationship<input name="parent_relationship" value="{{student.parent_relationship if student else ''}}"></label></div><h2>Emergency Contact</h2><div class="form-grid"><label>Name<input name="emergency_name" value="{{student.emergency_name if student else ''}}"></label><label>Phone<input name="emergency_phone" value="{{student.emergency_phone if student else ''}}"></label><label>Relationship<input name="emergency_relationship" value="{{student.emergency_relationship if student else ''}}"></label></div><div class="form-grid"><label>ID Type<input name="id_type" value="{{student.id_type if student else ''}}"></label><label>ID Number<input name="id_number" value="{{student.id_number if student else ''}}"></label></div><label>Medical Notes<textarea name="medical_notes">{{student.medical_notes if student else ''}}</textarea></label><label>Other Notes<textarea name="notes">{{student.notes if student else ''}}</textarea></label><div class="actions"><button>Save Student</button><a href="{{url_for('students')}}">Cancel</a></div></form>{% endblock %}
