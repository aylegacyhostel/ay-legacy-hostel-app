{% extends 'base.html' %}{% block content %}<h1>{% if payment %}Edit Payment{% else %}Record Payment{% endif %}</h1><p>{{student.first_name}} {{student.last_name}}</p><form class="form-card" method="post"><div class="form-grid"><label>Academic Year<input name="academic_year" value="{{payment.academic_year if payment else ''}}" placeholder="2026/2027"></label><label>Payment Type<input name="payment_type" value="{{payment.payment_type if payment else 'Hostel Fee'}}"></label><label>Amount Due<input type="number" step="0.01" name="amount_due" value="{{payment.amount_due if payment else ''}}" required></label><label>Amount Paid<input type="number" step="0.01" name="amount_paid" value="{{payment.amount_paid if payment else ''}}" required></label><label>Payment Date<input type="date" name="payment_date" value="{{payment.payment_date if payment else ''}}"></label><label>Method<input name="payment_method" value="{{payment.payment_method if payment else ''}}"></label><label>Reference<input name="reference" value="{{payment.reference if payment else ''}}"></label></div><label>Notes<textarea name="notes">{{payment.notes if payment else ''}}</textarea></label><button>Save Payment</button></form>{% endblock %}
