{% extends 'base.html' %}{% block content %}<h1>Audit Log</h1><div class="panel"><table><tr><th>Date</th><th>User</th><th>Action</th><th>Type</th><th>ID</th><th>Details</th></tr>{% for r in rows %}<tr><td>{{r.created_at}}</td><td>{{r.username}}</td><td>{{r.action}}</td><td>{{r.entity_type}}</td><td>{{r.entity_id or '-'}}</td><td>{{r.details or '-'}}</td></tr>{% endfor %}</table></div>{% endblock %}
