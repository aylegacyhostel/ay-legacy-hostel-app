{% extends 'base.html' %}{% block content %}<h1>{% if room %}Edit Room{% else %}Add Room{% endif %}</h1><form class="form-card" method="post"><div class="form-grid"><label>Room Number<input name="room_number" required value="{{room.room_number if room else ''}}"></label><label>Capacity<input type="number" min="1" name="capacity" value="{{room.capacity if room else 1}}"></label><label>Floor<input name="floor" value="{{room.floor if room else ''}}"></label><label>Room Type<input name="room_type" value="{{room.room_type if room else ''}}"></label><label>Rate<input type="number" step="0.01" name="monthly_rate" value="{{room.monthly_rate if room else 0}}"></label><label>Status<select name="status">{% for x in ['Available','Full','Maintenance'] %}<option {% if room and room.status==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label></div><label>Notes<textarea name="notes">{{room.notes if room else ''}}</textarea></label><button>Save Room</button></form>{% endblock %}
