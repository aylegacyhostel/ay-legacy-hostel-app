{% extends 'base.html' %}{% block content %}<h1>Add Staff Account</h1><form class="form-card" method="post"><div class="form-grid"><label>Full Name<input name="full_name" required></label><label>Username<input name="username" required></label><label>Password<input type="password" name="password" required></label><label>Role<input value="Staff (admin-controlled)" disabled></label></div><h2>Assign Permissions</h2><p>Total hostel income and staff management are always admin-only.</p>{% for p in permissions %}<label style="display:block;margin:8px 0"><input type="checkbox" name="permissions" value="{{p}}" {% if p in defaults %}checked{% endif %}> {{p.replace('.', ' / ').replace('_',' ').title()}}</label>{% endfor %}<button>Create Account</button></form>{% endblock %}
