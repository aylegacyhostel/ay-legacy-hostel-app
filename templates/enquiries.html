{% extends 'base.html' %}{% block content %}<h1>Enquiries</h1><div class="panel"><table><tr><th>Date</th><th>Name</th><th>Phone</th><th>School</th><th>Program</th><th>Year</th><th>Preferred Room</th><th>Status</th></tr>{% for e in enquiries %}<tr><td>{{e.created_at}}</td><td>{{e.name}}</td><td>{{e.phone}}</td><td>{{e.school or '-'}}</td><td>{{e.program or '-'}}</td><td>{{e.year_level or '-'}}</td><td>{{e.preferred_room or '-'}}</td><td><form method="post" action="{{url_for('enquiry_status',eid=e.id)}}"><select name="status" onchange="this.form.submit()">{% for s in ['New','Contacted','Accepted','Closed'] %}<option {% if e.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></form></td></tr>{% endfor %}</table></div>{% endblock %}
