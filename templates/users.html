{% extends 'base.html' %}{% block content %}<div class="pagehead"><h1>Staff Accounts</h1><a class="btn" href="{{url_for('new_user')}}">+ Add Staff</a></div><div class="panel"><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr>{% for u in users %}<tr><td>{{u.full_name or '-'}}</td><td>{{u.username}}</td><td>{{u.role}}</td><td>{{'Active' if u.active else 'Disabled'}}</td><td>{% if u.id!=1 %}<a href="{{url_for('toggle_user',uid=u.id)}}">{{'Disable' if u.active else 'Enable'}}</a>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
